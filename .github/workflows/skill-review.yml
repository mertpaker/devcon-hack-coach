name: Skill Review

on:
  pull_request:
    paths: ['**/SKILL.md']

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4.3.0
      - uses: tesslio/skill-review@main
        with:
          tessl-token: ${{ secrets.TESSL_API_TOKEN }}
          fail-threshold: 90
